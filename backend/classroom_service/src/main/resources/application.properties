## Local development properties

# JWT secret (Base64). Replace with a secure value for production.
jwt.secret=ZmFrZV9zZWNyZXRfa2V5X3Rlc3Rfa2V5XzEyMzQ1Ng==

# Use in-memory H2 for local development
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Server port (optional)
server.port=8082

# Reduce logging noise while developing
logging.level.org.springframework=INFO
logging.level.com.example.classroom_service=DEBUG
spring.application.name=classroom_service
# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8082

# ─── Database ─────────────────────────────────────────────────────────────────
# Use environment variables when available; fall back to in-memory H2 for local dev.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false
# ─── JWT ──────────────────────────────────────────────────────────────────────
# Must match the secret used by auth-service. For local dev you can set a placeholder here.
# Replace before deploying to production; do NOT commit real secrets.
jwt.secret=${JWT_SECRET}

# ─── File Upload ──────────────────────────────────────────────────────────────
file.upload-dir=uploads/classroom-service
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

spring.security.user.name=disabled
spring.security.user.password=disabled

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.example.classroom_service=DEBUG
logging.level.org.springframework.security=INFO